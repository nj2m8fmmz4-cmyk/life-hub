<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>Life Hub</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--bg:#08090b;--card:#111318;--line:rgba(255,255,255,.08);--text:#f5f5f7;--muted:#8c9099}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#20242d 0%,#0d0f13 32%,#08090b 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(100%,650px);margin:auto;min-height:100vh;padding:28px 18px 115px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:14px;font-weight:800;letter-spacing:.5px}.version{color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:100px;padding:6px 9px}.hero{margin-bottom:16px}.hero h1,.page-heading{margin:0;font-size:clamp(38px,10vw,54px);letter-spacing:-2.5px;line-height:.98}.hero p,.page-sub{color:var(--muted);margin:12px 0 20px;font-size:15px}.eyebrow,.section-title{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:10px}.card{background:rgba(17,19,24,.9);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:12px}.now-card{padding:24px;background:linear-gradient(145deg,rgba(31,35,44,.96),rgba(15,17,21,.96))}.task-clickable{cursor:pointer}.task-clickable:active{opacity:.72}.task-title{font-size:20px;font-weight:750;line-height:1.15}.now-card .task-title{font-size:30px}.priority{display:inline-block;margin-top:13px;padding:7px 10px;border-radius:100px;background:rgba(255,255,255,.07);color:#c9ccd2;font-size:12px}.meta,.empty{color:var(--muted);font-size:12px;margin-top:6px}.detail-line{color:#b4b7be;font-size:12px;margin-top:5px}.task-time{font-size:13px;font-weight:800;margin-bottom:6px}.actions{displ ont-size:16px;font-weight:750}.day-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5);margin:6px auto 0;opacity:0}.day.has-task .day-dot{opacity:1}.day.today{border-color:rgba(255,255,255,.18)}.day.selected{background:#f5f5f7;color:#090a0c}.day.selected .day-name{color:#55585f}.day.selected .day-dot{background:#090a0c}.area{background:rgba(17,19,24,.9);border:1px solid var(--line);border-radius:20px;margin-bottom:10px;overflow:hidden}.area-header{display:flex;justify-content:space-between;align-items:center;padding:18px;cursor:pointer}.area-name{font-size:18px;font-weight:750}.area-count{color:var(--muted);font-size:12px;margin-top:4px}.area-arrow{color:#8c9099;font-size:20px;transition:transform .2s ease}.area.open .area-arrow{transform:rotate(90deg)}.area-content{max-height:0;overflow:hidden;transition:max-height .28s ease}.area.open .area-content{max-height:2800px;border-top:1px solid var(--line)}.area-inner{padding:10px 18px 18px}.subsection{margin-top:10px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(255,255,255,.025)}.subsection-header{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer}.subsection-title{font-size:14px;font-weight:700}.subsection-right{display:flex;align-items:center;gap:8px}.subsection-count{color:var(--muted);font-size:11px}.subsection-arrow{color:var(--muted);font-size:17px;transition:transform .2s ease}.subsection.open .subsection-arrow{transform:rotate(90deg)}.subsection-content{max-height:0;overflow:hidden;transition:max-height .24s ease}.subsection.open .subsection-content{max-height:1500px}.subsection-inner{padding:0 14px 10px}.area-task{padding:13px 0;border-top:1px solid var(--line);cursor:pointer}.area-task:first-child{border-top:0}.area-task-name{font-size:14px;font-weight:700}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.2s ease}.modal-backdrop.open{opacity:1;pointer-events:auto}.detail-modal{width:min(100%,620px);max-height:82vh;overflow:auto;background:#14161b;border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:22px;transform:translateY(30px);transition:.22s ease;box-shadow:0 25px 80px rgba(0,0,0,.5)}.modal-backdrop.open .detail-modal{transform:translateY(0)}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.modal-title{font-size:24px;font-weight:800;letter-spacing:-.7px}.close-button{width:38px;height:38px;min-height:38px;border-radius:100px;padding:0;background:rgba(255,255,255,.08);color:white;font-size:18px}.modal-section{padding:13px 0;border-top:1px solid var(--line)}.modal-label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.modal-value{font-size:14px;line-height:1.45}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:rgba(25,27,33,.97);color:white;border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:12px 16px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:.22s ease;z-index:500;max-width:calc(100% - 36px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.page{display:none}.page.active{display:block}.bottom-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 28px);max-width:620px;padding:8px;border-radius:20px;background:rgba(19,21,26,.92);border:1px solid var(--line);backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;z-index:30}.nav{color:#777b84;text-align:center;padding:12px 5px;border-radius:13px;font-size:12px;font-weight:750;cursor:pointer}.nav.active{background:rgba(255,255,255,.08);col    </button></div><div id="modalContent"></div></div></div><div id="toast" class="toast"></div><script>  const AREA_STRUCTURE={  "Life Hubl":[ "Appointments", "Documents & ID", "Goals", "Errands", "General" ],  "Family":[ "Parents", "Family Tasks", "Support", "General" ],  "Money":[ "Bills", "Debt", "Savings", "Banking", "Purchases", "General" ],  "Work":[ "Schedule", "Pay", "Tasks", "Career", "General" ],  "Business":[ "Clients", "Promotion", "Events", "Operations", "Ideas", "General" ],  "Projects":[ "Life Hub", "Living Tree", "Mandaeism", "Builds", "Ideas", "General" ],  "Health":[ "Appointments", "Fitness", "Food", "Routine", "General" ],  "Home":[ "Room", "Cleaning", "Laundry", "Maintenance", "General" ],  "Learning":[ "School", "Courses", "Research", "Skills", "General" ],  "Social":[ "Friends", "Plans", "Messages", "Events", "General" ],  "Travel & Events":[ "Trips", "Bookings", "Nightlife", "Birthdays", "General" ],  "Cars & Transport":[ "License", "Car", "Maintenance", "Transit", "General" ],  "Digital":[ "Phone", "Computer", "Accounts", "Apps", "General" ],  "Admin":[ "Forms", "Renewals", "Calls", "Government", "General" ],  "General":[ "General" ]  };  function getToday(){  const d=new Date(); d.setHours(0,0,0,0);  return d;  }  function startOfDay(date){  const d=new Date(date); d.setHours(0,0,0,0);  return d;  }  function addDays(date,amount){  const d=new Date(date);  d.setDate( d.getDate()+amount );  return d;  }  function addMonths(date,amount){  const d=new Date(date);  d.setMonth( d.getMonth()+amount );  return d;  }  function dateKey(date){  const d=startOfDay(date);  const year=d.getFullYear();  const month= String( d.getMonth()+1 ).padStart(2,"0");  const day= String( d.getDate() ).padStart(2,"0");  return( year+ "-"+ month+ "-"+ day );  }  function parseDateKey(key){  return new Date( key+"T12:00:00" );  }  function sameDay(a,b){  return( dateKey(a)=== dateKey(b) );  }  function prettyDate(date){  return new Intl .DateTimeFormat( undefined, { weekday:"long", month:"long", day:"numeric" } ) .format( new Date(date) );  }  function shortDate(date){  return new Intl .DateTimeFormat( undefined, { month:"short", day:"numeric" } ) .format( new Date(date) );  }  function friendlyDate(key){  const date= parseDateKey(key);  const today= getToday();  if( sameDay( date, today ) ){ return "Today"; }  if( sameDay( date, addDays(today,1) ) ){ return "Tomorrow"; }  return shortDate(date);  }  let selectedDate= getToday();  let taskToFocus= null;  let tasks= JSON.parse( localStorage.getItem( "lifehub21_tasks" ) ) || [];  tasks= tasks.map( task=>({  ...task,  scheduledDate: task.scheduledDate || dateKey( getToday() ),  scheduledTime: task.scheduledTime || null,  person: task.person || "",  location: task.location || "",  appointmentType: task.appointmentType || "",  details: task.details || "",  rotatedAt: task.rotatedAt || null,  upNextAt: task.upNextAt || null  }) );  let notes= JSON.parse( localStorage.getItem( "lifehub21_notes" ) ) || JSON.parse( localStorage.getItem( "lifehub21_inbox" ) ) || [];  let completed= JSON.parse( localStorage.getItem( "lifehub21_completed" ) ) || [];  function save(){  localStorage.setItem( "lifehub21_tasks", JSON.stringify(tasks) );  localStorage.setItem( "lifehub21_notes", JSON.stringify(notes) );  localStorage.setItem( "lifehub21_completed", JSON.stringify(completed) );  }  function escapeHTML(value){  return String(value) .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;");  }  function showToast(message, taskId = null) {  const toast = document.getElementById("toast");  toast.textContent = taskId ? message + " · Tap to open" : message;  toast.classList.add("show");  toast.onclick = null; toast.style.cursor = "default";  if (taskId) {  toast.style.cursor = "pointer";  toast.onclick = () => {  toast.classList.remove("show");  openTaskInPlan(taskId);  };  }  clearTimeout(window.lifeHubToastTimer);  window.lifeHubToastTimer = setTimeout(() => {  toast.classList.remove("show"); toast.onclick = null;  }, 5000);  }  function splitTasks(text){  let parts= text .split( /\n+|;|•|\band then\b|\bthen\b/gi ) .map( item=> item.trim() ) .filter(Boolean);  if( parts.length===1 ){  const commaParts= text .split(",") .map( item=> item.trim() ) .filter(Boolean);  const signal= /\btoday\b|\btomorrow\b|\btmrw\b|\btmr\b|\bmonday\b|\btuesday\b|\bwednesday\b|\bthursday\b|\bfriday\b|\bsaturday\b|\bsunday\b|\bcall\b|\bpay\b|\bclean\b|\bbook\b|\bappointment\b|\bdentist\b|\bdoctor\b|\bwork\b|\bgym\b|\bbuy\b|\brenew\b|\bfinish\b|\bmessage\b|\btext\b|\bemail\b|\bpick up\b|\bdrop off\b/i;  const likelyMultiple= commaParts.length>1 && commaParts.filter( part=> signal.test(part) ).length>=2;  if( likelyMultiple ){ parts= commaParts; }  }  return parts;  }  function detectSchedule(text){  const lower= text .toLowerCase() .trim();  const today= getToday();  if( /\bday after tomorrow\b/i .test(lower) ){  return dateKey( addDays( today, 2 ) );  }  if ( /\bday after tomorrow\b/i .test(lower) ) { return dateKey( addDays( today, 2 ) ); }  if( /\b(tomorrow|tmrw|tmr)\b/i .test(lower) ){  return dateKey( addDays( today, 1 ) );  }  if( /\b(today|tonight)\b/i .test(lower) ){  return dateKey( today );  }  const weekdays=[ "sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday" ];  for( let i=0; i<weekdays.length; i++ ){  if( new RegExp( "\\b"+ weekdays[i]+ "\\b", "i" ) .test(lower) ){  let difference= i- today.getDay();  if( difference<=0 ){ difference+=7; }  return dateKey( addDays( today, difference ) );  }  }  const months={  january:0, jan:0, february:1, feb:1, march:2, mar:2, april:3, apr:3, may:4, june:5, jun:5, july:6, jul:6, august:7, aug:7, september:8, sept:8, sep:8, october:9, oct:9, november:10, nov:10, december:11, dec:11  };  for( const [name,index] of Object.entries(months) ){  const match= text.match( new RegExp( "\\b"+ name+ "\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:\\s*,?\\s*(\\d{4}))?", "i
